function canonUjian(v) {
  const s = smartMatch(v);
  if (s.startsWith('imni') || s.includes('ujianakhir') || s === 'akhir') return 'IMNI';
  if (s === 'imda1' || s === 'imdai') return 'IMDA I';
  if (s === 'imda2' || s === 'imdaii') return 'IMDA II';
  if (s === 'imda3' || s === 'imdaiii') return 'IMDA III';
  return String(v || '').trim();
}

function kategoriOf(t) {
  const m = S.data.mapel.find(x => smartMatch(x.Tingkat) === smartMatch(t.Tingkat) && smartMatch(x.Kelas) === smartMatch(t.Kelas) && smartMatch(x.Mapel) === smartMatch(t.Mapel));
  return m ? m.Kategori : '';
}

function compRows(tingkat, kat, kelas, ujian) {
  const tTingkat = smartMatch(tingkat);
  const tKat = smartMatch(kat);
  const tKelas = String(kelas == null ? '' : kelas).trim();
  const tUjian = canonUjian(ujian);
  const scoped = S.data.komposisi.filter(r => {
    if (smartMatch(r.Tingkat) !== tTingkat) return false;
    if (canonUjian(r.Ujian) !== tUjian) return false;
    const kelasArr = String(r.Kelas).split(/[,;\s]+/).map(x => x.trim());
    if (!kelasArr.includes(tKelas)) return false;
    return true;
  });
  const exact = scoped.filter(r => smartMatch(r.Kategori) === tKat);
  if (exact.length) return exact;
  const umum = scoped.filter(r => smartMatch(r.Kategori) === 'seluruhfan');
  if (umum.length) return umum;
  return [];
}

function summarize(rows) {
  const ty = {};
  rows.forEach(r => {
    ty[r.Tipe] = ty[r.Tipe] || { tipe: r.Tipe, total: 0, materi: [] };
    const n = +r.Jumlah || 0; ty[r.Tipe].total += n; ty[r.Tipe].materi.push({ m: r.Materi, n });
  });
  const types = ['A', 'B', 'C', 'D'].filter(t => ty[t]).map(t => { ty[t].materi.sort((a, b) => (ROM[a.m] || 9) - (ROM[b.m] || 9)); return ty[t]; });
  const dibuat = types.reduce((s, x) => s + x.total, 0);
  return { types, dibuat, jadi: dibuat - types.length };
}
function compFor(t) { return summarize(compRows(t.Tingkat, kategoriOf(t), t.Kelas, t.Ujian)); }

function bobotOf(tingkat, kat, ujian, tipe) {
  const tTingkat = smartMatch(tingkat);
  const tKat = smartMatch(kat);
  const tUjian = canonUjian(ujian);
  const tTipe = String(tipe).trim().toUpperCase();
  const cari = (cariKat) => S.data.bobot.find(x => smartMatch(x.Tingkat) === tTingkat && smartMatch(x.Kategori) === cariKat && canonUjian(x.Ujian) === tUjian && String(x.Tipe).trim().toUpperCase() === tTipe);
  let b = cari(tKat);
  if (!b) b = cari('seluruhfan');
  return b ? +b.Bobot : null;
}
